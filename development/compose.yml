name: injectcode

x-toolchain: &toolchain
  image: injectcode-tools
  build:
    context: ..
    dockerfile: development/Dockerfile
    target: toolchain
  environment:
    - CI=true
  volumes:
    - ..:/app
    - pnpm-store:/pnpm-store

x-e2e: &e2e
  image: injectcode-e2e
  build:
    context: ..
    dockerfile: development/Dockerfile
    target: e2e
  environment:
    - CI=true
  volumes:
    - ..:/app
    - pnpm-store:/pnpm-store
  ipc: host # Chromium wants more than Docker's default 64MB /dev/shm, hence ipc: host;
  init: true # init reaps the child processes it leaves behind

services:

  node:
    <<: *toolchain
    command: tail -f /dev/null

  install:
    <<: *toolchain
    command: sh -c "pnpm install --frozen-lockfile --store-dir /pnpm-store"

  install-update:
    <<: *toolchain
    command: sh -c "pnpm install --no-frozen-lockfile --store-dir /pnpm-store"

  update-latest:
    <<: *toolchain
    command: sh -c "pnpm update --latest --store-dir /pnpm-store"

  build:
    <<: *toolchain
    command: sh -c "pnpm install --frozen-lockfile --store-dir /pnpm-store && pnpm run build"

  audit:
    <<: *toolchain
    command: sh -c "pnpm run audit"

  audit-fix:
    <<: *toolchain
    command: sh -c "pnpm run audit-fix"

  type-check:
    <<: *toolchain
    command: sh -c "pnpm run type-check"

  test:
    <<: *toolchain
    command: sh -c "pnpm run test"

  lint:
    <<: *toolchain
    command: sh -c "pnpm run lint"

  lint-fix:
    <<: *toolchain
    command: sh -c "pnpm run lint-fix"

  dev:
    <<: *toolchain
    command: sh -c "pnpm run start"

  validate:
    <<: *e2e
    command: sh -c "pnpm run validate"

  e2e:
    <<: *e2e
    environment:
      - CI=true
      - PLAYWRIGHT_JSON_OUTPUT_NAME=development/.artifacts/e2e.json
    entrypoint: ["pnpm", "exec", "playwright", "test", "--reporter=list,json"]
    command: []

  e2e-debug:
    <<: *e2e
    environment:
      - CI=true
      - PLAYWRIGHT_JSON_OUTPUT_NAME=development/.artifacts/e2e-debug.json
    entrypoint: ["pnpm", "exec", "playwright", "test", "--reporter=list,json", "--retries=0"]
    command: []

volumes:
  pnpm-store:
    external: true
