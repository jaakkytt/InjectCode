name: injectcode

x-toolchain: &toolchain
  image: injectcode-tools
  build:
    context: ..
    dockerfile: development/Dockerfile
    target: toolchain
  environment:
    - CI=true
  volumes:
    - ..:/app
    - pnpm-store:/pnpm-store

services:

  node:
    <<: *toolchain
    command: tail -f /dev/null

  install:
    <<: *toolchain
    command: sh -c "pnpm install --frozen-lockfile --store-dir /pnpm-store"

  install-update:
    <<: *toolchain
    command: sh -c "pnpm install --no-frozen-lockfile --store-dir /pnpm-store"

  update-latest:
    <<: *toolchain
    command: sh -c "pnpm update --latest --store-dir /pnpm-store"

  build:
    <<: *toolchain
    command: sh -c "pnpm install --frozen-lockfile --store-dir /pnpm-store && pnpm run build"

  audit:
    <<: *toolchain
    command: sh -c "pnpm run audit"

  audit-fix:
    <<: *toolchain
    command: sh -c "pnpm run audit-fix"

  type-check:
    <<: *toolchain
    command: sh -c "pnpm run type-check"

  test:
    <<: *toolchain
    command: sh -c "pnpm run test"

  lint:
    <<: *toolchain
    command: sh -c "pnpm run lint"

  lint-fix:
    <<: *toolchain
    command: sh -c "pnpm run lint-fix"

  dev:
    <<: *toolchain
    command: sh -c "pnpm run start"

  validate:
    <<: *toolchain
    command: sh -c "pnpm run validate"

volumes:
  pnpm-store:
    external: true
